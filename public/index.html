<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Family Grocery List</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Family grocery list</p>
        <h1 id="family"></h1>
        <p class="presence" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <span id="presence">Connecting…</span>
        </p>
      </header>

      <form id="join" class="stack" hidden>
        <label for="name">What should the family call you?</label>
        <div class="row">
          <input id="name" maxlength="24" autocomplete="nickname" required />
          <button>Join</button>
        </div>
      </form>

      <section id="list" hidden>
        <form id="add" class="row">
          <label for="item" class="visually-hidden">Add an item</label>
          <input id="item" placeholder="Add an item…" maxlength="80" autocomplete="off" required />
          <button>Add</button>
        </form>
        <p id="error" class="error" role="alert"></p>
        <ul id="items"></ul>
        <p id="empty" class="empty">Nothing on the list yet. Add something!</p>
        <p class="me">You're <strong id="me"></strong> · <button id="rename" class="link" type="button">change</button></p>
      </section>

      <footer>Join the family at <strong id="join-url"></strong></footer>
    </main>
  </body>
</html>
